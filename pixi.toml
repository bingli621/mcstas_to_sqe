[workspace]
authors = ["Bing Li <bing.li@ess.eu>"]
channels = ["conda-forge"]
name = "mcstas_to_sqe"
platforms = [{ name = "my-osx-arm64", platform = "osx-arm64", macos = "14.0" }, "linux-64"]

[tasks]

[dependencies]
mcstas = ">=3.10.0,<4"
mcstasscript = ">=0.0.96,<0.0.97"
scipp = ">=26.9.0,<27"
pytest = ">=9.1.1,<10"
scippneutron = ">=26.10.0,<27"
matplotlib = ">=3.11.2,<4"
pytest-cov = ">=7.1.0,<8"
pyyaml = ">=6.0.3,<7"
pre-commit = ">=4.7.0,<5"
tabulate = ">=0.10.0,<0.11"
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
h5py = ">=3.16.0,<4"

[pypi-dependencies]
mcstas_to_sqe = { path = ".", editable = true }
mcstastox = { git = "https://github.com/mads-bertelsen-agentic/McStasToX", rev = "af80792680397168f5fd185afa392116bd4cf848" }
