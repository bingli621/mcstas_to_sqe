[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcstas_to_sqe"
dynamic = ["version"]  # from src/mcstas_to_sqe/__init__.py, see [tool.hatch.version]
description = "Neutron instruments simulated in McStas from their components, with an example of a single-crystal diffraction scan reduced to momentum transfer and Miller indices"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bing Li", email = "bing.li@ess.eu" }]
dependencies = [
    "h5py>=3.16.0,<4",
    "matplotlib>=3.11.2,<4",
    "mcstasscript>=0.0.96,<0.0.97",
    "mcstastox @ git+https://github.com/mads-bertelsen-agentic/McStasToX@af80792680397168f5fd185afa392116bd4cf848",
    "numpy>=2.5.4,<3",
    "pyyaml>=6.0.3,<7",
    "scipp>=25.12.0,<27",
    "scippneutron>=26.10.0,<27",
    "scipy>=1.18.1,<2",
    "tabulate>=0.10.0,<0.11",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.hatch.version]
# the one place the version is set: __version__ in the package
path = "src/mcstas_to_sqe/__init__.py"

[tool.hatch.metadata]
# mcstastox is not on PyPI; it is pinned to a git commit
allow-direct-references = true

[tool.hatch.build.targets.sdist]
# the README's images are for GitHub, not for the source distribution
exclude = ["docs/"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcstas_to_sqe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# numpydoc docstrings and type hints, for the package (not the tests and scripts)
extend-select = ["D", "ANN"]
ignore = [
    "ANN401",  # Any: params is any params_class, values may be anything
    "D105",  # magic methods: a docstring only where they do something unusual
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"scripts/**" = ["D", "ANN"]
